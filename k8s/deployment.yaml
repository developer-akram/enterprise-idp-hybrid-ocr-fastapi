apiVersion: apps/v1
kind: Deployment
metadata:
  name: idp-hybrid-ocr-api
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: idp-hybrid-ocr
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: api
          image: asia-south1-docker.pkg.dev/project-id/idp/hybrid-ocr-api:v1.0
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1500m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 8
            periodSeconds: 5
